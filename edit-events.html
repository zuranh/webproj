<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin – Edit Events</title>
    <link rel="stylesheet" href="admin-page.css" />
    <link rel="stylesheet" href="admin-events.css" />
  </head>

  <body>
    <aside class="sidebar">
      <div class="logo">Eventify Admin</div>
      <nav>
        <a class="nav-link" href="admin.html">Admin profile</a>
        <a class="nav-link" href="admin-users.html" data-require-owner>Admin Users</a>
        <a class="nav-link" href="addEvents.html">Add Events</a>
        <a class="nav-link active" href="edit-events.html">Edit Events</a>
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="admin-actions.html">Admin Actions</a>
      </nav>
    </aside>

    <main class="content">
      <header class="page-header">
        <h1>Edit Events</h1>
        <p>Select an event to update its details, status, or genres.</p>
      </header>

      <section class="panel">
        <div class="panel-header">
          <h3>Choose an event to edit</h3>
        </div>
        <div id="event-list" class="events-grid">
          <p class="no-events">Loading events...</p>
        </div>
      </section>

      <section class="edit-form" id="edit-form">
        <div class="alert" id="form-alert"></div>

        <div class="form-row">
          <div class="input-group">
            <label for="event-title">Event Title *</label>
            <input type="text" id="event-title" required />
          </div>

          <div class="input-group">
            <label for="event-status">Status *</label>
            <select id="event-status" required>
              <option value="published">Published</option>
              <option value="archived">Archived</option>
            </select>
          </div>
        </div>

        <div class="input-group">
          <label for="event-description">Description *</label>
          <textarea id="event-description" rows="5" required></textarea>
        </div>

        <div class="form-row">
          <div class="input-group">
            <label for="event-date">Date *</label>
            <input type="date" id="event-date" required />
          </div>

          <div class="input-group">
            <label for="event-time">Time *</label>
            <input type="time" id="event-time" required />
          </div>
        </div>

        <div class="input-group">
          <label for="event-location">Location *</label>
          <input type="text" id="event-location" required />
        </div>

        <div class="form-row">
          <div class="input-group">
            <label for="event-age">Age Restriction</label>
            <input type="number" id="event-age" placeholder="0 = all ages" />
          </div>

          <div class="input-group">
            <label for="event-price">Ticket Price ($)</label>
            <input type="number" id="event-price" min="0" step="0.01" placeholder="0.00" />
          </div>
        </div>

        <div class="form-row">
          <div class="input-group">
            <label for="event-capacity">Capacity</label>
            <input type="number" id="event-capacity" min="0" placeholder="0 = unlimited" />
          </div>

          <div class="input-group">
            <label for="event-image">Image URL</label>
            <input type="url" id="event-image" placeholder="https://example.com/event.jpg" />
          </div>
        </div>

        <div class="input-group">
          <label>Genres</label>
          <div class="genre-selection" id="genre-selection">
            <p>Loading genres...</p>
          </div>
        </div>

        <div class="form-actions">
          <button class="btn-primary" id="save-event">Update Event</button>
          <button class="btn-danger" id="delete-event" type="button">Delete Event</button>
          <button class="btn-secondary" id="cancel-edit" type="button">Cancel</button>
        </div>
      </section>

      <footer class="footer">
        <p>© 2025 Eventify Admin — Development Mode</p>
      </footer>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.x/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.x/firebase-auth-compat.js"></script>
    <script src="/firebase-compat-init.js"></script>
    <script src="/scripts/admin-auth.js"></script>
    <script src="/scripts/admin-edit-events.js"></script>
  </body>
</html>
